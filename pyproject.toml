[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "intraday-patterns"
version = "0.1.0"
description = "Tests of intraday chart-pattern claims on MarketParquet data"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=12.0",
    "requests>=2.28",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "statsmodels>=0.14",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
]

[project.optional-dependencies]
test = ["pytest>=7"]

# The shared detectors in lib/ are installed as top-level modules, so
# `from holdout import ...` works from any script without editing sys.path.
[tool.setuptools]
package-dir = {"" = "lib"}
py-modules = ["holdout", "intraday_levels", "paths", "r_multiple", "setups_v2", "swing_levels"]

[tool.pytest.ini_options]
testpaths = ["tests"]
